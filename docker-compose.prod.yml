version: '3.8'

# Production docker-compose with stricter configurations
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  # MySQL Database Service - Production Configuration
  mysql:
    image: mysql:8.0
    container_name: quest-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-quest_generator}
      MYSQL_USER: ${DB_USER:-quest_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"  # Only accessible from localhost
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./backups:/backups
    networks:
      - quest-network-prod
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=1000
      - --max-allowed-packet=256M
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Qdrant Vector Database - Production Configuration
  qdrant:
    image: qdrant/qdrant:latest
    container_name: quest-qdrant-prod
    restart: always
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"  # Only accessible from localhost
    volumes:
      - qdrant_storage_prod:/qdrant/storage
    networks:
      - quest-network-prod
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      timeout: 10s
      retries: 5
      interval: 10s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # FastAPI Backend - Production Configuration
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: quest-generator-backend:latest
    container_name: quest-backend-prod
    restart: always
    ports:
      - "127.0.0.1:${PORT:-8010}:${PORT:-8010}"  # Only accessible from localhost
    environment:
      # Database
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-quest_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-quest_generator}
      
      # Server (Production)
      PORT: ${PORT:-8010}
      DEBUG: false
      LOG_LEVEL: warning
      
      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_HTTPS: false
      
      # AI Configuration
      AI_MODE: ${AI_MODE:-hybrid}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      
      XAI_BASE_URL: https://api.x.ai/v1
      XAI_MODEL: ${XAI_MODEL}
      XAI_API_KEY: ${XAI_API_KEY}
      
      OPENAI_BASE_URL: https://api.openai.com/v1
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      GEMINI_BASE_URL: https://generativelanguage.googleapis.com/v1beta
      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - quest-network-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8010}/docs"]
      timeout: 10s
      retries: 5
      interval: 15s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

volumes:
  mysql_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MYSQL_DATA_PATH:-./mysql_data_prod}
  qdrant_storage_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${QDRANT_DATA_PATH:-./qdrant_storage_prod}

networks:
  quest-network-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
